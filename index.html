<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨은 원인을 찾아라!</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1F3A4D;--paper:#FBF9F4;--winter:#4A7FA5;--midseason:#C99A3C;
  --summer:#D96C4F;--accent:#2E7D6B;--warn:#C0563B;
  --font-d:'Gowun Batang',serif;--font-b:'Pretendard',system-ui,sans-serif;
  --hh:68px;--fh:72px;--r:12px;
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font-b);font-size:18px;line-height:1.6}
button{cursor:pointer;font-family:var(--font-b);border:none;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea{font-family:var(--font-b)}
strong{color:var(--ink);font-weight:700}

/* ── PRESENT MODE ── */
body.present{font-size:24px}
body.present .slide-title{font-size:48px!important}
body.present .slide-body p{font-size:24px!important}
body.present .step-title{font-size:44px!important}
body.present .step-subtitle{font-size:22px!important}
body.present .data-table{font-size:20px!important}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;min-height:100vh;max-width:1280px;margin:0 auto;position:relative}
#header{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:1280px;height:var(--hh);
  background:var(--paper);border-bottom:1px solid rgba(31,58,77,.12);
  display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100
}
#app-title{font-family:var(--font-d);font-size:18px;font-weight:700;white-space:nowrap}
#progress-bar{display:flex;align-items:center;flex:1;justify-content:center;gap:0}
.step-dot{
  width:30px;height:30px;border-radius:50%;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:white;transition:transform .3s;flex-shrink:0
}
.step-conn{width:16px;height:2px;background:rgba(31,58,77,.18);flex-shrink:0;transition:background .3s}
.step-conn.done{background:var(--accent)}
.step-dot[data-s="0"]{background:#8fa8b5}
.step-dot[data-s="1"]{background:#4A7FA5}
.step-dot[data-s="2"]{background:#6b96a8}
.step-dot[data-s="3"]{background:#C99A3C}
.step-dot[data-s="4"]{background:#c87c50}
.step-dot[data-s="5"]{background:#2E7D6B}
.step-dot[data-s="6"]{background:#D96C4F}
.step-dot[data-s="7"]{background:#9b6d7a}
.step-dot.pending{background:transparent!important;border-color:rgba(31,58,77,.25);color:rgba(31,58,77,.35)}
.step-dot.active{transform:scale(1.3);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent)}
.header-btns{display:flex;gap:8px;flex-shrink:0}
.hdr-btn{font-size:16px;padding:6px 10px;border-radius:8px;border:1px solid rgba(31,58,77,.2);white-space:nowrap}

#content{margin-top:var(--hh);margin-bottom:var(--fh);padding:24px;min-height:calc(100vh - var(--hh) - var(--fh))}
#footer{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:1280px;height:var(--fh);
  background:var(--paper);border-top:1px solid rgba(31,58,77,.12);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;z-index:100
}
.nav-btn{min-width:110px;min-height:44px;padding:10px 22px;border-radius:var(--r);font-size:17px;font-weight:600;transition:all .2s}
#prev-btn{color:var(--ink);border:2px solid rgba(31,58,77,.22)}
#prev-btn:hover:not(:disabled){border-color:var(--ink)}
#prev-btn:disabled{opacity:0;pointer-events:none}
#next-btn{background:var(--accent);color:white;border:2px solid transparent}
#next-btn:hover:not(:disabled){filter:brightness(1.1)}
#next-btn:disabled{background:rgba(31,58,77,.13);color:rgba(31,58,77,.38);cursor:not-allowed}

/* ── PRESENT PRESENTER BAR ── */
#pbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:1280px;background:rgba(31,58,77,.9);
  color:white;padding:6px 16px;font-size:14px;z-index:200;
  display:none;flex-direction:column;gap:2px
}
body.present #pbar{display:flex}
body.present #footer{display:none}
#pbar-counter{opacity:.7}
#pbar-note{font-size:13px;opacity:.85}

/* ── PRESENT CLICK ZONES ── */
.present-zone{display:none;position:fixed;top:var(--hh);width:10%;height:calc(100vh - var(--hh));z-index:50;cursor:pointer}
body.present .present-zone{display:block}
#pz-left{left:0}
#pz-right{right:0}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:white;padding:11px 22px;border-radius:var(--r);
  font-size:15px;opacity:0;transition:opacity .3s,transform .3s;z-index:300;pointer-events:none;white-space:nowrap
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── BANNER ── */
#banner{
  position:fixed;top:var(--hh);left:50%;transform:translateX(-50%) translateY(-100%);
  background:var(--warn);color:white;padding:13px 28px;font-size:17px;font-weight:600;
  text-align:center;width:100%;max-width:1280px;transition:transform .4s;z-index:150
}
#banner.show{transform:translateX(-50%) translateY(0)}

/* ── SLIDE CARD ── */
.slide-card{max-width:780px;margin:0 auto;background:white;border-radius:16px;padding:48px 52px;box-shadow:0 2px 16px rgba(31,58,77,.1)}
.slide-tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(31,58,77,.4);margin-bottom:12px}
.slide-title{font-family:var(--font-d);font-size:32px;font-weight:700;margin-bottom:22px;color:var(--ink)}
.slide-body p{font-size:19px;line-height:1.9;color:rgba(31,58,77,.88);margin-bottom:6px}
.slide-body p:last-child{margin-bottom:0}

/* ── ACTIVITY COMMONS ── */
.step-title{font-family:var(--font-d);font-size:28px;font-weight:700;margin-bottom:6px}
.step-subtitle{font-size:17px;color:rgba(31,58,77,.65);margin-bottom:20px}
.card{background:white;border-radius:var(--r);padding:20px 24px;box-shadow:0 1px 5px rgba(31,58,77,.07)}
.key-msg{background:rgba(46,125,107,.08);border-left:4px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:14px 20px;font-size:17px}
.data-table{width:100%;border-collapse:collapse;font-size:16px}
.data-table th,.data-table td{padding:9px 12px;text-align:right;border-bottom:1px solid rgba(31,58,77,.07)}
.data-table th{font-weight:700;background:rgba(31,58,77,.04);text-align:center}
.data-table td:first-child{text-align:center;font-weight:600}

/* ── 1단계 ── */
.s1-grid{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}

/* ── 2단계 ── */
.q-text{font-family:var(--font-d);font-size:26px;text-align:center;margin-bottom:26px}
.ox-row{display:flex;gap:24px;justify-content:center;margin-bottom:26px}
.ox-btn{width:120px;height:120px;border-radius:50%;font-size:52px;font-weight:900;background:white;border:3px solid rgba(31,58,77,.18);transition:all .2s;box-shadow:0 2px 8px rgba(31,58,77,.09)}
.ox-btn:hover{transform:scale(1.06)}
.ox-btn.sel-O{background:rgba(46,125,107,.1);border-color:var(--accent);box-shadow:0 0 0 4px rgba(46,125,107,.2)}
.ox-btn.sel-X{background:rgba(192,86,59,.1);border-color:var(--warn);box-shadow:0 0 0 4px rgba(192,86,59,.2)}
.reason-in{display:block;width:100%;max-width:540px;margin:0 auto;padding:13px 17px;font-size:17px;border:2px solid rgba(31,58,77,.22);border-radius:var(--r);background:white;color:var(--ink);outline:none}
.reason-in:focus{border-color:var(--accent)}

/* ── 3단계 ── */
.m-pool{display:flex;gap:9px;flex-wrap:wrap;padding:4px 2px 8px;min-height:80px;align-items:flex-start}
.mcard{flex-shrink:0;background:white;border:2px solid rgba(31,58,77,.18);border-radius:var(--r);padding:9px 12px;cursor:pointer;transition:all .2s;min-width:76px;text-align:center;user-select:none}
.mcard .mn{font-family:var(--font-d);font-size:18px;font-weight:700;display:block}
.mcard .ms{font-size:11px;color:rgba(31,58,77,.55)}
.mcard:hover{border-color:var(--accent)}
.mcard.selected{border-color:var(--accent);background:rgba(46,125,107,.07);box-shadow:0 0 0 3px rgba(46,125,107,.2)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.mcard.shake{animation:shake .45s ease}
.sboxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;margin-top:13px}
.sbox{min-height:120px;border-radius:var(--r);border:2px dashed rgba(31,58,77,.18);padding:11px;cursor:pointer;transition:border-color .2s,background .2s}
.sbox.sw{border-color:rgba(74,127,165,.4)}.sbox.sm{border-color:rgba(201,154,60,.4)}.sbox.ss{border-color:rgba(217,108,79,.4)}
.sbox.sw:hover,.sbox.sw.tgt{border-style:solid;border-color:var(--winter);background:rgba(74,127,165,.05)}
.sbox.sm:hover,.sbox.sm.tgt{border-style:solid;border-color:var(--midseason);background:rgba(201,154,60,.05)}
.sbox.ss:hover,.sbox.ss.tgt{border-style:solid;border-color:var(--summer);background:rgba(217,108,79,.05)}
.sbox-ttl{font-weight:700;font-size:15px;margin-bottom:7px}
.sbox.sw .sbox-ttl{color:var(--winter)}.sbox.sm .sbox-ttl{color:var(--midseason)}.sbox.ss .sbox-ttl{color:var(--summer)}
.cib{display:flex;flex-wrap:wrap;gap:5px}
.sbox.sw .mcard{border-color:rgba(74,127,165,.5);background:rgba(74,127,165,.07)}
.sbox.sm .mcard{border-color:rgba(201,154,60,.5);background:rgba(201,154,60,.07)}
.sbox.ss .mcard{border-color:rgba(217,108,79,.5);background:rgba(217,108,79,.07)}
.check-btn{display:block;margin:13px auto 0;padding:11px 30px;background:var(--ink);color:white;border-radius:var(--r);font-size:17px;font-weight:600;min-height:44px}
.toggle-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:2px solid var(--ink);color:var(--ink);border-radius:var(--r);font-size:14px;font-weight:600;margin-bottom:13px}

/* ── 4단계 ── */
.diag-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0}
#diag{max-width:500px;width:100%}
.dn{opacity:0;transition:opacity .6s}.dn.vis{opacity:1}

/* ── アリ FACE ── */
.ari-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.bubble{
  position:relative;background:white;border:2px solid var(--ink);border-radius:14px;
  padding:12px 16px;font-size:16px;line-height:1.5;max-width:260px;text-align:center;
  animation:bubPop .25s ease
}
.bubble::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--ink)}
.bubble::before{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:white;z-index:1}
@keyframes bubPop{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.ari-mini{margin-bottom:4px}

/* ── 5단계 ── */
.s5-learn{display:flex;align-items:center;gap:20px;margin-bottom:20px;padding:16px 20px;background:white;border-radius:var(--r);box-shadow:0 1px 5px rgba(31,58,77,.07)}
.learn-tbl{font-size:14px;border-collapse:collapse}
.learn-tbl th,.learn-tbl td{padding:5px 10px;border-bottom:1px solid rgba(31,58,77,.07);text-align:right}
.learn-tbl th{font-weight:700;background:rgba(31,58,77,.04)}
.learn-tbl td:first-child{text-align:center;font-weight:600}
@keyframes flyAri{0%{transform:translateX(0) scale(1);opacity:1}100%{transform:translateX(-90px) scale(.05);opacity:0}}
.fly{animation:flyAri .8s ease-in forwards}
.sit-cards{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sit-card{flex:1;min-width:160px;padding:12px 14px;border:2px solid rgba(31,58,77,.18);border-radius:var(--r);background:white;cursor:pointer;transition:all .2s;font-size:15px;text-align:center}
.sit-card:hover{border-color:var(--accent)}
.sit-card.sel{border-color:var(--accent);background:rgba(46,125,107,.08)}
.sit-card.special{border-color:var(--summer)}
.sit-card.special.sel{background:rgba(217,108,79,.08)}
.heat-slider{width:100%;margin:8px 0}
.predict-btn{padding:12px 28px;background:var(--accent);color:white;border-radius:var(--r);font-size:17px;font-weight:600;min-height:44px;margin-top:4px}
.doubt-badge{display:inline-block;padding:8px 16px;background:rgba(217,108,79,.12);border:2px solid var(--summer);border-radius:100px;font-size:15px;font-weight:600;color:var(--summer);margin-top:10px}
.why-btn{display:block;width:100%;margin-top:16px;padding:13px;background:var(--ink);color:white;border-radius:var(--r);font-size:17px;font-weight:600;min-height:44px}
.concept-card{margin-top:16px;padding:16px 20px;background:rgba(46,125,107,.08);border-left:4px solid var(--accent);border-radius:0 var(--r) var(--r) 0;font-size:16px}

/* ── 6단계 ── */
.s6-top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-bottom:16px}
.ari-panel{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:160px}
.slider-sec{max-width:560px;margin:0 auto 16px}
.sl-title{text-align:center;font-weight:700;font-size:19px;margin-bottom:9px}
.sl-labels{display:flex;justify-content:space-between;font-size:14px;color:rgba(31,58,77,.6);margin-bottom:7px}
.sl-helper{text-align:center;font-size:14px;line-height:1.45;color:rgba(31,58,77,.72);margin-top:8px}
#pslider{width:100%;height:8px;-webkit-appearance:none;appearance:none;border-radius:4px;outline:none;cursor:pointer}
#pslider::-webkit-slider-thumb{-webkit-appearance:none;width:50px;height:50px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 10px rgba(46,125,107,.35);transition:background .3s}
#pslider.warn::-webkit-slider-thumb{background:var(--warn)}
#pslider::-moz-range-thumb{width:50px;height:50px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#pslider.warn::-moz-range-thumb{background:var(--warn)}
.push-intro{font-size:16px;margin-bottom:16px;padding:12px 16px;background:rgba(31,58,77,.04);border-radius:var(--r)}
.push-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px}
.push-col{display:flex;flex-direction:column;align-items:center;gap:12px}
.push-sign-wrap{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.push-sign{
  width:190px;padding:16px;border:3px solid var(--ink);border-radius:10px;
  background:white;text-align:center;transform-origin:bottom center;
  transition:transform .4s;position:relative
}
.push-sign .claim{font-weight:700;font-size:15px;margin-bottom:6px}
.push-sign .badge{display:none;margin-top:8px;padding:4px 12px;border-radius:100px;font-size:13px;font-weight:700}
.push-sign.fallen{transform:rotate(90deg)!important}
@keyframes fallBounce{0%{transform:rotate(0)}60%{transform:rotate(95deg)}80%{transform:rotate(87deg)}100%{transform:rotate(90deg)}}
.push-sign.falling{animation:fallBounce .5s ease forwards}
@keyframes shudder{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}50%{transform:rotate(-2deg)}60%{transform:rotate(2deg)}70%{transform:rotate(-1deg)}80%{transform:rotate(1deg)}}
.push-sign.shudder{animation:shudder .6s ease}
.push-pole{width:6px;height:24px;background:var(--ink);border-radius:3px}
.push-gauge-wrap{width:100%;background:rgba(31,58,77,.1);border-radius:4px;height:10px}
.push-gauge-bar{height:10px;border-radius:4px;transition:width .3s;background:var(--accent)}
.push-btn{padding:10px 24px;background:var(--ink);color:white;border-radius:var(--r);font-size:16px;font-weight:600;min-height:44px;transition:all .2s}
.push-btn:disabled{background:rgba(31,58,77,.2);cursor:not-allowed}
.push-expand{font-size:14px;color:rgba(31,58,77,.75);margin-top:6px;padding:10px;background:rgba(31,58,77,.04);border-radius:8px;display:none}
.push-expand.open{display:block}
.push-msg{font-size:15px;margin-top:8px;padding:10px;background:rgba(46,125,107,.08);border-radius:8px;display:none}
.push-msg.show{display:block}
.summary-card{margin-top:16px;padding:16px 20px;background:white;border-radius:var(--r);box-shadow:0 1px 5px rgba(31,58,77,.07);font-size:16px;display:none}
.summary-card.show{display:block}

/* ── 7단계 ── */
.prev-card{background:rgba(31,58,77,.04);border-radius:var(--r);padding:16px 20px;margin-bottom:20px}
.chk-list{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.chk-item{display:flex;align-items:center;gap:13px;background:white;border-radius:var(--r);padding:14px 18px;cursor:pointer;border:2px solid rgba(31,58,77,.1);transition:all .2s;font-size:16px;font-weight:500}
.chk-item:hover{border-color:var(--accent)}
.chk-item.chked{border-color:var(--accent);background:rgba(46,125,107,.05)}
.chk-ico{width:26px;height:26px;border-radius:50%;border:2px solid rgba(31,58,77,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:all .2s}
.chk-item.chked .chk-ico{background:var(--accent);border-color:var(--accent);color:white}
.sum-ta{width:100%;padding:13px 17px;font-size:17px;border:2px solid rgba(31,58,77,.22);border-radius:var(--r);background:white;color:var(--ink);outline:none;resize:vertical;min-height:78px}
.sum-ta:focus{border-color:var(--accent)}

/* ── COMPLETION ── */
#comp{display:none;text-align:center;padding:32px 20px;max-width:600px;margin:0 auto}
#comp.active{display:block}
.comp-h{font-family:var(--font-d);font-size:36px;font-weight:700;margin-bottom:8px}
.comp-sub{font-size:19px;color:rgba(31,58,77,.75);margin-bottom:26px}
.ch-msg{font-size:18px;padding:14px 20px;border-radius:var(--r);margin-bottom:20px;font-weight:600}
.ch-msg.ch{background:rgba(46,125,107,.09);color:var(--accent)}
.ch-msg.nc{background:rgba(31,58,77,.06);color:var(--ink)}
.sum-cards{text-align:left;display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.sum-item{background:white;border-radius:var(--r);padding:14px 20px;box-shadow:0 1px 4px rgba(31,58,77,.07)}
.sum-lbl{font-size:12px;font-weight:700;color:rgba(31,58,77,.45);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.sum-val{font-size:17px}
.restart-btn{padding:13px 34px;background:var(--accent);color:white;border-radius:var(--r);font-size:17px;font-weight:600;min-height:44px}
.submit-card{background:white;border:2px solid var(--ink);border-radius:8px;box-shadow:4px 5px 0 var(--ink);padding:16px 18px;margin:18px auto 20px;text-align:left}
.submit-card label{display:block;font-size:14px;font-weight:900;margin-bottom:7px}
.submit-row{display:flex;gap:10px;align-items:center}
.submit-row input{flex:1;min-width:0}
.submit-row button{min-height:44px;padding:9px 16px;background:var(--mint);color:white;border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);font-weight:900}
.submit-row button:disabled{background:#eef2f4;color:#8090a0;box-shadow:none;border-color:#c9d2da;cursor:not-allowed}
.submit-status{min-height:22px;margin-top:9px;font-size:14px;font-weight:800;color:var(--ink-soft)}
.submit-status.ok{color:var(--accent)}
.submit-status.err{color:var(--warn)}

/* ── TEACHER PANEL ── */
#tpanel{position:fixed;top:var(--hh);right:-380px;width:380px;height:calc(100vh - var(--hh));background:white;border-left:2px solid rgba(31,58,77,.12);overflow-y:auto;transition:right .3s;z-index:90;padding:18px;box-shadow:-4px 0 18px rgba(31,58,77,.08)}
#tpanel.open{right:0}
#tpanel h3{font-family:var(--font-d);font-size:19px;margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid rgba(31,58,77,.1)}
.ts{margin-bottom:16px}
.ts h4{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
.ts p{font-size:13px;color:rgba(31,58,77,.8);line-height:1.6;margin-bottom:5px}
.t-tbl{width:100%;border-collapse:collapse;font-size:13px}
.t-tbl th,.t-tbl td{padding:5px 8px;text-align:right;border-bottom:1px solid rgba(31,58,77,.07)}
.t-tbl th{font-weight:700;background:rgba(31,58,77,.04)}
.g-item{padding:9px 11px;border-radius:7px;margin-bottom:5px;font-size:13px;border:1px solid transparent}
.g-item.cur{background:rgba(46,125,107,.1);border-color:var(--accent)}
#auto-btn{display:block;width:100%;padding:9px;background:var(--midseason);color:white;border-radius:8px;font-size:14px;font-weight:600;margin-top:5px}
#tclose{width:100%;padding:9px;background:rgba(31,58,77,.07);border-radius:8px;font-size:14px;color:var(--ink);margin-top:13px}
.teacher-tool{background:var(--midseason);color:white;border-color:transparent}
[hidden]{display:none!important}
.board-actions{display:flex;gap:8px;margin-bottom:9px}
.board-actions button{flex:1;padding:8px;background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:2px 2px 0 var(--ink);font-size:13px;font-weight:900;color:var(--ink)}
.board-status{font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:8px}
.board-status.err{color:var(--warn)}
.board-list{display:grid;gap:8px;max-height:260px;overflow:auto;padding-right:3px}
.resp-item{border:1px solid rgba(31,58,77,.16);border-left:5px solid var(--accent);border-radius:8px;background:#fff;padding:9px 10px;font-size:13px}
.resp-meta{display:flex;justify-content:space-between;gap:8px;font-weight:900;margin-bottom:4px}
.resp-text{color:var(--ink-soft);line-height:1.45;word-break:break-word}
.resp-empty{padding:10px;border-radius:8px;background:rgba(31,58,77,.05);font-size:13px;color:var(--ink-soft)}
.season-chart-card{padding:14px}
.season-chart{display:block;width:100%;height:auto;min-height:300px}
.season-chart text{font-family:var(--font-b);fill:var(--ink)}
.season-chart .axis-label{font-size:15px;font-weight:900}
.season-chart .tick{font-size:12px;fill:rgba(18,32,51,.62)}
.season-chart .point-label{font-size:12px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.season-chart .legend-text{font-size:13px;font-weight:900}

/* ── MODALS ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(31,58,77,.45);z-index:400;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.mbox{background:white;border-radius:var(--r);padding:30px;max-width:360px;width:90%;text-align:center}
.mbox p{font-size:17px;margin-bottom:20px}
.mbts{display:flex;gap:11px;justify-content:center}
.mbts button{padding:9px 26px;border-radius:var(--r);font-size:16px;font-weight:600}
.mconf{background:var(--accent);color:white}
.mcanc{background:rgba(31,58,77,.09);color:var(--ink)}

/* Design refresh: detective lab for elementary learners */
:root{
  --ink:#122033;
  --ink-soft:#3f5368;
  --paper:#f7fbff;
  --surface:#fffdf8;
  --surface-2:#ffffff;
  --sky:#2f8fd8;
  --sky-soft:#dff2ff;
  --mint:#12a88a;
  --mint-soft:#dff7ef;
  --sun:#f5bd32;
  --sun-soft:#fff1bd;
  --coral:#ef6b59;
  --coral-soft:#ffe2dc;
  --grape:#7058d8;
  --line:rgba(18,32,51,.14);
  --shadow:0 14px 32px rgba(18,32,51,.12);
  --shadow-soft:0 7px 18px rgba(18,32,51,.08);
  --font-d:'Jua','Pretendard',system-ui,sans-serif;
  --font-b:'Pretendard','Gowun Dodum',system-ui,sans-serif;
  --hh:78px;
  --fh:82px;
  --r:8px;
  --ari-face:#f9feff;
  --ari-shell:#69d1ff;
  --ari-shell-dark:#1687c6;
  --ari-hat:#ffd45d;
  --ari-cheek:#ff8c7b;
}
html,body{
  min-height:100%;
  background:
    linear-gradient(90deg,rgba(47,143,216,.08) 1px,transparent 1px),
    linear-gradient(rgba(47,143,216,.08) 1px,transparent 1px),
    linear-gradient(180deg,#f7fbff 0%,#fffaf1 54%,#f4fff9 100%);
  background-size:28px 28px,28px 28px,auto;
  color:var(--ink);
  font-family:var(--font-b);
  letter-spacing:0;
  overflow-x:hidden;
}
body.present{font-size:24px}
body.present #content{padding-top:18px;padding-bottom:76px}
body.present .slide-card{max-width:1120px;min-height:500px}
body.present .slide-copy{padding:30px 38px}
body.present .slide-title{font-size:44px!important}
body.present .slide-body p{font-size:20px!important;line-height:1.52;padding:12px 14px}
body.present .slide-visual{min-height:500px}
body.present .visual-card{padding:22px}
button,input,textarea{letter-spacing:0}
button{touch-action:manipulation}
canvas{display:block;width:100%;max-width:100%}
#app{
  width:100%;
  max-width:none;
  min-height:100vh;
  overflow-x:clip;
}
#header{
  position:sticky;
  top:0;
  left:auto;
  transform:none;
  width:100%;
  max-width:none;
  height:var(--hh);
  background:rgba(255,253,248,.94);
  border-bottom:2px solid rgba(18,32,51,.1);
  box-shadow:0 8px 22px rgba(18,32,51,.08);
  backdrop-filter:blur(10px);
  padding:10px clamp(16px,3vw,34px);
  gap:16px;
  z-index:180;
}
#app-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--font-d);
  font-size:22px;
  color:var(--ink);
  letter-spacing:0;
}
.brand-mark{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--sun);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  font-size:25px;
  line-height:1;
}
#progress-bar{
  position:relative;
  justify-content:center;
  gap:5px;
  min-width:250px;
  padding:0 10px;
}
.step-dot{
  width:34px;
  height:34px;
  border:3px solid var(--ink);
  color:white;
  font-size:13px;
  box-shadow:2px 2px 0 var(--ink);
}
.step-dot[data-s="0"]{background:var(--grape)}
.step-dot[data-s="1"]{background:var(--sky)}
.step-dot[data-s="2"]{background:var(--mint)}
.step-dot[data-s="3"]{background:var(--sun);color:var(--ink)}
.step-dot[data-s="4"]{background:var(--coral)}
.step-dot[data-s="5"]{background:#38c4d9}
.step-dot[data-s="6"]{background:#ff8f3d}
.step-dot[data-s="7"]{background:#8f6be8}
.step-dot.pending{
  background:#fff!important;
  color:rgba(18,32,51,.36);
  border-color:rgba(18,32,51,.2);
  box-shadow:none;
}
.step-dot.active{
  transform:translateY(-2px) scale(1.13);
  box-shadow:0 0 0 4px #fff,4px 5px 0 var(--ink);
}
.step-conn{
  width:22px;
  height:4px;
  border-radius:999px;
  background:rgba(18,32,51,.16);
}
.step-conn.done{background:var(--mint)}
.header-btns{gap:10px}
.hdr-btn{
  min-height:40px;
  padding:8px 13px;
  border-radius:8px;
  border:2px solid var(--ink);
  background:#fff;
  color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  font-size:15px;
  font-weight:800;
}
.hdr-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
#content{
  margin-top:0;
  margin-bottom:var(--fh);
  width:min(1180px,100%);
  margin-left:auto;
  margin-right:auto;
  padding:28px clamp(16px,3.2vw,38px) 112px;
  min-height:calc(100vh - var(--hh) - var(--fh));
}
#footer{
  bottom:14px;
  width:min(1180px,calc(100% - 28px));
  max-width:none;
  height:64px;
  padding:9px 12px;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  pointer-events:none;
}
.nav-btn{
  min-width:122px;
  min-height:44px;
  border-radius:8px;
  font-weight:900;
  letter-spacing:0;
  pointer-events:auto;
}
#prev-btn{
  background:#fff;
  color:var(--ink);
  border:2px solid var(--ink);
}
#next-btn{
  background:var(--mint);
  color:#fff;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
}
#next-btn:hover:not(:disabled){filter:none;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
#next-btn:disabled{
  background:#eef2f4;
  color:#8090a0;
  border-color:#c9d2da;
  box-shadow:none;
}
#toast{
  bottom:96px;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  border-radius:8px;
}
#banner{
  top:calc(var(--hh) + 10px);
  left:50%;
  width:min(920px,calc(100% - 28px));
  max-width:none;
  transform:translateX(-50%) translateY(calc(-100% - 24px));
  background:var(--coral);
  border:3px solid var(--ink);
  border-radius:8px;
  box-shadow:5px 6px 0 var(--ink);
  padding:14px 20px;
  z-index:170;
}
#banner.show{transform:translateX(-50%) translateY(0)}

.slide-card{
  width:min(980px,100%);
  max-width:980px;
  min-height:430px;
  display:grid;
  grid-template-columns:minmax(260px,360px) minmax(0,1fr);
  gap:0;
  margin:8px auto 0;
  padding:0;
  border:3px solid var(--ink);
  border-radius:8px;
  background:var(--surface);
  box-shadow:9px 10px 0 var(--ink);
  overflow:hidden;
}
.slide-visual{
  min-height:430px;
  display:flex;
  align-items:stretch;
  justify-content:center;
  background:
    linear-gradient(135deg,rgba(255,212,93,.68),rgba(105,209,255,.45) 50%,rgba(18,168,138,.28));
  border-right:3px solid var(--ink);
}
.slide-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:42px clamp(24px,4vw,50px);
  background:
    linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,253,248,.92)),
    repeating-linear-gradient(0deg,transparent 0,transparent 34px,rgba(47,143,216,.09) 35px);
}
.slide-tag{
  display:inline-flex;
  align-self:flex-start;
  align-items:center;
  gap:6px;
  margin-bottom:14px;
  padding:7px 10px;
  border:2px solid var(--ink);
  border-radius:999px;
  background:var(--sun-soft);
  color:var(--ink);
  font-size:13px;
  font-weight:900;
  letter-spacing:0;
  text-transform:none;
  box-shadow:2px 2px 0 var(--ink);
}
.slide-title{
  font-family:var(--font-d);
  font-size:42px;
  line-height:1.08;
  color:var(--ink);
  margin-bottom:22px;
  letter-spacing:0;
}
.slide-body{
  display:grid;
  gap:10px;
}
.slide-body p{
  position:relative;
  margin:0;
  padding:13px 15px;
  border:1px solid rgba(18,32,51,.1);
  border-radius:8px;
  background:rgba(255,255,255,.78);
  color:var(--ink-soft);
  font-size:20px;
  line-height:1.72;
}
.slide-body strong{
  color:var(--ink);
  background:linear-gradient(transparent 58%,rgba(245,189,50,.55) 58%);
}
.visual-card{
  width:100%;
  min-height:100%;
  padding:26px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:18px;
}
.visual-title{
  align-self:flex-start;
  padding:7px 11px;
  border:2px solid var(--ink);
  border-radius:999px;
  background:#fff;
  font-size:14px;
  font-weight:900;
  box-shadow:2px 2px 0 var(--ink);
}
.case-board{
  display:grid;
  gap:12px;
  padding:16px;
  border:3px solid var(--ink);
  border-radius:8px;
  background:#fff;
  box-shadow:5px 6px 0 var(--ink);
}
.evidence-row{display:flex;gap:10px;align-items:center;justify-content:center}
.evidence-note{
  min-width:74px;
  padding:13px 10px;
  border:2px solid var(--ink);
  border-radius:8px;
  background:var(--sun-soft);
  text-align:center;
  font-family:var(--font-d);
  font-size:24px;
}
.arrow-chip{
  min-width:52px;
  min-height:32px;
  padding:0 12px;
  box-sizing:border-box;
  display:grid;
  place-items:center;
  border:2px solid var(--ink);
  border-radius:999px;
  background:var(--mint-soft);
  font-weight:900;
  white-space:nowrap;
}
.magnifier{
  width:116px;
  height:116px;
  align-self:center;
  border:9px solid var(--sky);
  border-radius:50%;
  background:rgba(255,255,255,.5);
  position:relative;
  box-shadow:inset 0 0 0 3px var(--ink),5px 6px 0 var(--ink);
}
.magnifier::after{
  content:'';
  position:absolute;
  width:58px;
  height:13px;
  right:-42px;
  bottom:4px;
  background:var(--ink);
  border-radius:999px;
  transform:rotate(43deg);
}
.mini-chart{
  height:158px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:18px;
  border:3px solid var(--ink);
  border-radius:8px;
  background:#fff;
  box-shadow:5px 6px 0 var(--ink);
}
.mini-bar{
  flex:1;
  border:2px solid var(--ink);
  border-radius:8px 8px 0 0;
  background:var(--sky);
  min-height:32px;
}
.mini-bar:nth-child(2n){background:var(--coral)}
.season-stack{display:grid;grid-template-columns:1fr;gap:10px}
.season-pill{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 14px;
  border:3px solid var(--ink);
  border-radius:8px;
  background:#fff;
  box-shadow:4px 4px 0 var(--ink);
  font-weight:900;
}
.season-pill:nth-child(1){background:var(--sky-soft)}
.season-pill:nth-child(2){background:var(--sun-soft)}
.season-pill:nth-child(3){background:var(--coral-soft)}
.cause-map{
  display:grid;
  gap:18px;
  justify-items:center;
}
.cause-node{
  min-width:150px;
  padding:15px 16px;
  border:3px solid var(--ink);
  border-radius:8px;
  background:#fff;
  text-align:center;
  font-family:var(--font-d);
  font-size:25px;
  box-shadow:4px 4px 0 var(--ink);
}
.cause-branches{
  width:230px;
  height:64px;
  position:relative;
}
.cause-branches::before,.cause-branches::after{
  content:'';
  position:absolute;
  top:0;
  width:110px;
  height:4px;
  background:var(--ink);
}
.cause-branches::before{left:18px;transform:rotate(32deg);transform-origin:left center}
.cause-branches::after{right:18px;transform:rotate(-32deg);transform-origin:right center}
.cause-bottom{display:flex;gap:18px}
.ari-stage{
  align-items:center;
  text-align:center;
}
.ari-nameplate{
  padding:8px 13px;
  border:2px solid var(--ink);
  border-radius:999px;
  background:var(--mint-soft);
  font-weight:900;
  box-shadow:2px 2px 0 var(--ink);
}
.strength-meter{
  display:grid;
  gap:12px;
  padding:18px;
  border:3px solid var(--ink);
  border-radius:8px;
  background:#fff;
  box-shadow:5px 6px 0 var(--ink);
}
.meter-track{height:20px;border:2px solid var(--ink);border-radius:999px;background:#eef3f5;overflow:hidden}
.meter-fill{height:100%;width:68%;background:linear-gradient(90deg,var(--mint),var(--sun),var(--coral))}
.push-demo{display:flex;gap:14px;justify-content:center;align-items:flex-end}
.push-demo .sign{
  width:112px;
  padding:12px;
  border:3px solid var(--ink);
  border-radius:8px;
  background:#fff;
  box-shadow:3px 3px 0 var(--ink);
  font-weight:900;
  text-align:center;
}
.push-demo .sign.fall{transform:rotate(20deg);background:var(--coral-soft)}
.check-demo{display:grid;gap:10px}
.check-demo div{
  padding:12px 14px;
  border:3px solid var(--ink);
  border-radius:8px;
  background:#fff;
  box-shadow:3px 3px 0 var(--ink);
  font-weight:900;
}

.step-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--font-d);
  font-size:34px;
  color:var(--ink);
  margin:4px 0 7px;
}
.step-title::before{
  content:'MISSION';
  padding:6px 9px;
  border:2px solid var(--ink);
  border-radius:999px;
  background:var(--sun);
  font-family:var(--font-b);
  font-size:12px;
  font-weight:900;
  box-shadow:2px 2px 0 var(--ink);
}
.step-subtitle{
  color:var(--ink-soft);
  font-size:18px;
  margin-bottom:18px;
}
.card{
  border:2px solid var(--ink);
  border-radius:8px;
  background:rgba(255,255,255,.9);
  box-shadow:5px 6px 0 var(--ink);
}
.key-msg{
  border:2px solid var(--ink);
  border-left:8px solid var(--mint);
  border-radius:8px;
  background:var(--mint-soft);
  color:var(--ink);
  font-weight:800;
  box-shadow:3px 3px 0 var(--ink);
}
.data-table th,.data-table td{
  border-bottom:2px solid rgba(18,32,51,.08);
}
.data-table th{
  background:var(--sky-soft);
  color:var(--ink);
}
.s1-grid{
  grid-template-columns:minmax(280px,430px) minmax(0,1fr);
  gap:20px;
}
.q-text{
  font-family:var(--font-d);
  font-size:34px;
}
.ox-btn{
  border:3px solid var(--ink);
  background:#fff;
  box-shadow:5px 6px 0 var(--ink);
  color:var(--ink);
}
.ox-btn:hover{transform:translate(-2px,-2px);box-shadow:7px 8px 0 var(--ink)}
.ox-btn.sel-O{background:var(--mint-soft);border-color:var(--ink)}
.ox-btn.sel-X{background:var(--coral-soft);border-color:var(--ink)}
.reason-in,.sum-ta{
  border:3px solid var(--ink);
  border-radius:8px;
  box-shadow:4px 4px 0 var(--ink);
}
.mcard{
  border:2px solid var(--ink);
  border-radius:8px;
  background:#fff;
  box-shadow:3px 3px 0 var(--ink);
}
.mcard.selected{
  border-color:var(--ink);
  background:var(--sun-soft);
  box-shadow:4px 4px 0 var(--ink);
}
.sbox{
  border:3px dashed rgba(18,32,51,.35);
  border-radius:8px;
  background:rgba(255,255,255,.62);
}
.sbox.sw:hover,.sbox.sw.tgt{border-color:var(--sky);background:var(--sky-soft)}
.sbox.sm:hover,.sbox.sm.tgt{border-color:var(--sun);background:var(--sun-soft)}
.sbox.ss:hover,.sbox.ss.tgt{border-color:var(--coral);background:var(--coral-soft)}
.check-btn,.toggle-btn,.predict-btn,.why-btn,.push-btn,.restart-btn,#auto-btn,#tclose{
  border:2px solid var(--ink);
  border-radius:8px;
  box-shadow:3px 3px 0 var(--ink);
  font-weight:900;
}
.check-btn,.why-btn,.push-btn{background:var(--ink);color:white}
.toggle-btn{background:#fff}
.predict-btn,.restart-btn{background:var(--mint);color:white}
.diag-wrap svg{filter:drop-shadow(4px 5px 0 rgba(18,32,51,.18))}
.ari-wrap{
  gap:10px;
}
.ari-svg{
  display:block;
  max-width:100%;
  filter:drop-shadow(5px 6px 0 rgba(18,32,51,.25));
}
.ari-svg .ari-head{transform-origin:80px 92px;animation:ariBob 3.2s ease-in-out infinite}
.ari-svg .ari-spark{transform-origin:center;animation:ariSpark 1.8s ease-in-out infinite}
@keyframes ariBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ariSpark{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.08)}}
.bubble{
  border:3px solid var(--ink);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  font-weight:700;
}
.bubble::after{border-top-color:var(--ink)}
.s5-learn{

<script>
(function(){
'use strict';
var Chart=window.Chart||(window.Chart=(function(){
  function color(v,fb){return Array.isArray(v)?v[0]:(v||fb);}
  function num(v,fb){v=Number(v);return isFinite(v)?v:fb;}
  function drawPoint(ctx,x,y,r,style){
    ctx.beginPath();
    if(style==='triangle'){
      ctx.moveTo(x,y-r);ctx.lineTo(x+r,y+r);ctx.lineTo(x-r,y+r);ctx.closePath();
    } else if(style==='rectRot'){
      ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.rect(-r*.75,-r*.75,r*1.5,r*1.5);ctx.restore();
    } else {
      ctx.arc(x,y,r,0,Math.PI*2);
    }
    ctx.fill();ctx.stroke();
  }
  function fallbackChart(ctx,cfg){
    this.ctx=ctx;
    this.canvas=ctx.canvas;
    this.config=cfg||{};
    this.data=this.config.data||{};
    this.options=this.config.options||{};
    this._resize=this.draw.bind(this);
    window.addEventListener('resize',this._resize);
    this.draw();
  }
  fallbackChart.prototype.destroy=function(){
    window.removeEventListener('resize',this._resize);
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
  };
  fallbackChart.prototype.update=function(){this.draw();};
  fallbackChart.prototype.draw=function(){
    var canvas=this.canvas,ctx=this.ctx,datasets=this.data.datasets||[],labels=this.data.labels||[];
    var parent=canvas.parentElement;
    var w=Math.max(320,Math.round((parent&&parent.getBoundingClientRect().width)||canvas.getBoundingClientRect().width||640));
    var attrH=parseInt(canvas.getAttribute('height')||'',10);
    var h=attrH||Math.max(260,Math.round(w*.56));
    var dpr=window.devicePixelRatio||1;
    canvas.style.width='100%';
    canvas.style.height=h+'px';
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,w,h);

    var isScatter=(this.config.type==='scatter')||datasets.some(function(ds){return ds.type==='scatter'||(ds.data&&ds.data[0]&&typeof ds.data[0]==='object');});
    var hasRight=datasets.some(function(ds){return ds.yAxisID&&ds.yAxisID!=='y'&&ds.yAxisID!=='yH';});
    var pad={l:58,r:hasRight?58:28,t:24,b:58};
    var plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;
    var xs=[],ysByAxis={y:[],yH:[],yF:[]};
    datasets.forEach(function(ds){
      (ds.data||[]).forEach(function(p,i){
        if(p&&typeof p==='object'){xs.push(num(p.x,i));ysByAxis[ds.yAxisID||'y'].push(num(p.y,0));}
        else {xs.push(i);ysByAxis[ds.yAxisID||'y'].push(num(p,0));}
      });
    });
    if(!xs.length){return;}
    var xMin=isScatter?Math.min.apply(null,xs):0,xMax=isScatter?Math.max.apply(null,xs):Math.max(1,labels.length-1);
    if(xMin===xMax){xMin-=1;xMax+=1;}
    function range(axis){
      var arr=ysByAxis[axis]&&ysByAxis[axis].length?ysByAxis[axis]:[].concat(ysByAxis.y,ysByAxis.yH,ysByAxis.yF);
      var min=Math.min.apply(null,arr),max=Math.max.apply(null,arr),gap=(max-min||1)*.12;
      return {min:Math.max(0,min-gap),max:max+gap};
    }
    var ranges={y:range('y'),yH:range('yH'),yF:range('yF')};
    function xScale(x){return pad.l+(x-xMin)/(xMax-xMin)*plotW;}
    function yScale(y,axis){var r=ranges[axis]||ranges.y;return pad.t+(r.max-y)/(r.max-r.min)*plotH;}

    ctx.strokeStyle='rgba(18,32,51,.14)';
    ctx.lineWidth=1;
    ctx.fillStyle='rgba(18,32,51,.58)';
    ctx.font='12px Pretendard, sans-serif';
    ctx.textAlign='right';
    ctx.textBaseline='middle';
    for(var g=0;g<=4;g++){
      var gy=pad.t+plotH*g/4;
      ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(w-pad.r,gy);ctx.stroke();
      var rv=ranges.yH.max-(ranges.yH.max-ranges.yH.min)*g/4;
      ctx.fillText(Math.round(rv),pad.l-8,gy);
      if(hasRight){
        ctx.textAlign='left';
        var rf=ranges.yF.max-(ranges.yF.max-ranges.yF.min)*g/4;
        ctx.fillText(Math.round(rf),w-pad.r+8,gy);
        ctx.textAlign='right';
      }
    }
    ctx.strokeStyle='#122033';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,h-pad.b);ctx.lineTo(w-pad.r,h-pad.b);ctx.stroke();
    if(hasRight){ctx.beginPath();ctx.moveTo(w-pad.r,pad.t);ctx.lineTo(w-pad.r,h-pad.b);ctx.stroke();}
    ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='rgba(18,32,51,.68)';
    var tickCount=isScatter?4:Math.min(labels.length,12);
    for(var t=0;t<tickCount;t++){
      var val=isScatter?xMin+(xMax-xMin)*t/(tickCount-1):t;
      var tx=xScale(val);
      var label=isScatter?Math.round(val):labels[t];
      ctx.fillText(label,tx,h-pad.b+10);
    }
    var xTitle=this.options.scales&&this.options.scales.x&&this.options.scales.x.title&&this.options.scales.x.title.text;
    if(xTitle){ctx.fillText(xTitle,pad.l+plotW/2,h-28);}

    datasets.forEach(function(ds){
      var axis=ds.yAxisID||'y';
      var data=ds.data||[];
      var dsType=ds.type||this.config.type;
      var c=color(ds.borderColor||ds.backgroundColor,'#122033');
      ctx.save();
      ctx.strokeStyle=c;ctx.fillStyle=color(ds.backgroundColor,c);ctx.lineWidth=3;
      ctx.setLineDash(ds.borderDash||[]);
      if(dsType!=='scatter'){
        ctx.beginPath();
        data.forEach(function(p,i){
          var x=p&&typeof p==='object'?p.x:i,y=p&&typeof p==='object'?p.y:p;
          var px=xScale(num(x,i)),py=yScale(num(y,0),axis);
          if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        });
        ctx.stroke();
      }
      ctx.setLineDash([]);
      data.forEach(function(p,i){
        var x=p&&typeof p==='object'?p.x:i,y=p&&typeof p==='object'?p.y:p;
        var px=xScale(num(x,i)),py=yScale(num(y,0),axis),r=num(ds.pointRadius,dsType==='scatter'?7:4);
        ctx.strokeStyle='#fff';ctx.lineWidth=2;drawPoint(ctx,px,py,r,ds.pointStyle||'circle');
      });
      ctx.restore();
    },this);
    ctx.font='13px Pretendard, sans-serif';
    ctx.textAlign='left';ctx.textBaseline='middle';
    var lx=pad.l,ly=h-14;
    datasets.forEach(function(ds){
      var c=color(ds.borderColor||ds.backgroundColor,'#122033');
      ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+22,ly);ctx.stroke();
      ctx.fillStyle='#122033';ctx.fillText(ds.label||'',lx+28,ly);
      lx+=Math.min(190,28+(ds.label||'').length*13);
    });
  };
  return fallbackChart;
})());

/* ══ PRNG ══ */
function mkPRNG(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
var prng=mkPRNG(20240901);
var BASE_TEMP=[-2,0,6,13,19,23,26,27,22,15,8,1];
var THRESHOLD=0.45;
var NOISES=BASE_TEMP.map(function(){return{h:prng()*4-2,f:prng()*30-15};});
function r1(v){return Math.round(v*10)/10;}
function genData(tp){
  return BASE_TEMP.map(function(t,i){
    return{month:i+1,temp:t,
      heating:r1(15+tp*(25-t)*.9+NOISES[i].h),
      flu:Math.round(40+tp*(27-t)*7+NOISES[i].f)};
  });
}
var DATA=genData(1.0);

/* ══ SEASON ══ */
var SMAP={1:'w',2:'w',12:'w',3:'m',4:'m',5:'m',9:'m',10:'m',11:'m',6:'s',7:'s',8:'s'};
var SLBL={w:'❄️ 겨울',m:'🍂 봄·가을',s:'☀️ 여름'};
var SCOL={w:'#4A7FA5',m:'#C99A3C',s:'#D96C4F'};

/* ══ AI: trainAri ══ */
function trainAri(data){
  var n=data.length,sx=0,sy=0,sxy=0,sxx=0,syy=0;
  data.forEach(function(d){sx+=d.heating;sy+=d.flu;sxy+=d.heating*d.flu;sxx+=d.heating*d.heating;syy+=d.flu*d.flu;});
  var mx=sx/n,my=sy/n;
  var num=sxy-n*mx*my,denX=sxx-n*mx*mx;
  var slope=denX?num/denX:0,intercept=my-slope*mx;
  var ssTot=syy-n*my*my,ssRes=0;
  data.forEach(function(d){var yh=slope*d.heating+intercept;ssRes+=(d.flu-yh)*(d.flu-yh);});
  var str=ssTot>0?Math.max(0,Math.min(1,1-ssRes/ssTot)):0;
  return{slope:slope,intercept:intercept,predict:function(h){return Math.round(slope*h+intercept);},strength:str};
}
function ariExpr(str){return str>=0.6?'conf':str>=0.3?'cur':'cur';}
function ariMsg(str){
  if(str>=0.6)return '난방비만 보면 독감을 맞힐 수 있어!';
  if(str>=0.3)return '음… 관계가 있는 것 같기도 하고?';
  return '난방비만으로는 모르겠어.';
}
function ariSVG(expr,sz){

  } else if(expr==='enl'){
    eyes='<circle cx="67" cy="86" r="8" fill="#fff" stroke="var(--ink)" stroke-width="4"/><circle cx="98" cy="86" r="8" fill="#fff" stroke="var(--ink)" stroke-width="4"/><circle cx="67" cy="86" r="3" fill="var(--ink)"/><circle cx="98" cy="86" r="3" fill="var(--ink)"/>';
    mouth='<circle cx="82" cy="107" r="5" fill="var(--ink)"/>';
    extra='<g class="ari-spark"><path d="M116 35h18v18h-18z" rx="5" fill="#fff" stroke="var(--ink)" stroke-width="3"/><path d="M121 44h8" stroke="var(--sun)" stroke-width="4" stroke-linecap="round"/></g>';
  } else {
    eyes='<circle cx="67" cy="86" r="5" fill="var(--ink)"/><circle cx="98" cy="86" r="5" fill="var(--ink)"/>';
    mouth='<path d="M73 107q9 5 18 0" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>';
    extra='<text x="118" y="57" font-size="25" fill="var(--ink)" font-weight="900">?</text>';
  }
  return '<svg class="ari-svg" viewBox="0 0 160 160" width="'+sz+'" height="'+sz+'" role="img" aria-label="AI 친구 아리">'
    +'<ellipse cx="82" cy="142" rx="43" ry="9" fill="rgba(18,32,51,.16)"/>'

    +extra
    +'<g class="ari-head">'
    +'<path d="M82 36v-14" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>'
    +'<circle cx="82" cy="18" r="7" fill="var(--sun)" stroke="var(--ink)" stroke-width="4"/>'
    +'<rect x="31" y="43" width="102" height="92" rx="32" fill="var(--ari-shell)" stroke="var(--ink)" stroke-width="4"/>'
    +'<rect x="45" y="61" width="74" height="59" rx="23" fill="var(--ari-face)" stroke="var(--ink)" stroke-width="4"/>'
    +eyes+mouth
    +'<circle cx="54" cy="102" r="5" fill="var(--ari-cheek)"/><circle cx="111" cy="102" r="5" fill="var(--ari-cheek)"/>'
    +'<rect x="60" y="124" width="44" height="20" rx="10" fill="#fff" stroke="var(--ink)" stroke-width="4"/>'
    +'<text x="82" y="139" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" font-weight="900" fill="var(--ink)">AI</text>'
    +'</g>'
    +'</svg>';
}

/* ══ TIMELINE ══ */
function txt(s){
  return s.split('\n').map(function(l){
    var h=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h=h.replace(/§B§([\s\S]*?)§E§/g,'<strong>$1</strong>');
    return '<p>'+h+'</p>';
  }).join('');
}
function bd(s){
  /* convert **x** to §B§x§E§ before passing to txt */
  return s.replace(/\*\*([\s\S]*?)\*\*/g,'§B§$1§E§');

/* ══ PROGRESS BAR ══ */
function renderProgress(){
  var bar=document.getElementById('progress-bar');
  bar.innerHTML='';
  var curStep=TL[ST.pos]?TL[ST.pos].s:7;
  for(var i=0;i<=7;i++){
    if(i>0){
      var conn=document.createElement('div');
      conn.className='step-conn'+(i<=curStep?' done':'');
      bar.appendChild(conn);
    }
    var d=document.createElement('div');
    d.className='step-dot'+(i===curStep?' active':i<curStep?'':' pending');
    d.dataset.s=i;
    d.textContent=i+1;
    bar.appendChild(d);
  }
}

/* ══ TOAST ══ */
var toastT=null;
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('show');},2800);}

/* ══ canProceed ══ */
function canProceed(){
  if(ST.presentMode)return true;
  var item=TL[ST.pos];
  if(!item)return true;
  if(item.k==='sl')return true;
  switch(item.s){
    case 1:return true;
    case 2:return ST.myAnswer!==null&&ST.myReason.trim().length>=1;
    case 3:return ST.scatterShown;
    case 4:return ST.s4done;
    case 5:return ST.aiPredicted&&ST.aiAsked;
    case 6:return ST.threshCrossed;
    case 7:return ST.checklist.every(Boolean)&&ST.summary.trim().length>=1;
  }
  return false;
}
function updNext(){document.getElementById('next-btn').disabled=!canProceed();}

/* ══ MAIN RENDER ══ */
var chart1=null,chart3=null,chart5=null,chart6=null,chart5why=null;
function destroyCharts(){
  [chart1,chart3,chart5,chart6,chart5why].forEach(function(c){if(c){c.destroy();}});
  chart1=chart3=chart5=chart6=chart5why=null;
}
function render(){
  destroyCharts();
  renderProgress();
  var c=document.getElementById('content');
  c.innerHTML='';
  if(ST.pos>=TL.length){showCompletion();return;}
  var item=TL[ST.pos];
  if(item.k==='sl')renderSlide(c,item);
  else renderActivity(c,item.s);
  document.getElementById('prev-btn').disabled=ST.pos===0;
  var isLast=ST.pos===TL.length-1;
  document.getElementById('next-btn').textContent=isLast?'완료':'다음 →';
  updNext();
  renderTeacher();
  if(ST.presentMode)renderPBar();
}

function seasonScatterSVG(byC){
  var w=720,h=450,p={l:70,r:34,t:28,b:95};
  var plotW=w-p.l-p.r,plotH=h-p.t-p.b;
  var xs=DATA.map(function(d){return d.heating;}),ys=DATA.map(function(d){return d.flu;});
  var xMin=Math.floor(Math.min.apply(null,xs))-2,xMax=Math.ceil(Math.max.apply(null,xs))+2;
  var yMin=0,yMax=Math.ceil((Math.max.apply(null,ys)+18)/20)*20;
  function x(v){return p.l+(v-xMin)/(xMax-xMin)*plotW;}
  function y(v){return p.t+(yMax-v)/(yMax-yMin)*plotH;}
  function grid(){
    var out='';
    for(var i=0;i<=5;i++){
      var yy=p.t+plotH*i/5,val=Math.round(yMax-(yMax-yMin)*i/5);
      out+='<line x1="'+p.l+'" y1="'+yy+'" x2="'+(w-p.r)+'" y2="'+yy+'" stroke="rgba(18,32,51,.12)" stroke-width="1"/>';
      out+='<text class="tick" x="'+(p.l-10)+'" y="'+(yy+4)+'" text-anchor="end">'+val+'</text>';
    }
    for(var j=0;j<=4;j++){
      var xx=p.l+plotW*j/4,valx=Math.round(xMin+(xMax-xMin)*j/4);
      out+='<line x1="'+xx+'" y1="'+p.t+'" x2="'+xx+'" y2="'+(h-p.b)+'" stroke="rgba(18,32,51,.08)" stroke-width="1"/>';
      out+='<text class="tick" x="'+xx+'" y="'+(h-p.b+22)+'" text-anchor="middle">'+valx+'</text>';
    }
    return out;
  }
  function point(d){
    var k=SMAP[d.month],col=byC?SCOL[k]:'#1F3A4D',px=x(d.heating),py=y(d.flu),shape='';
    if(byC&&k==='m'){
      shape='<path d="M '+px+' '+(py-11)+' L '+(px+11)+' '+(py+10)+' L '+(px-11)+' '+(py+10)+' Z" fill="'+col+'" stroke="#122033" stroke-width="2"/>';
    } else if(byC&&k==='s'){
      shape='<rect x="'+(px-9)+'" y="'+(py-9)+'" width="18" height="18" transform="rotate(45 '+px+' '+py+')" fill="'+col+'" stroke="#122033" stroke-width="2"/>';
    } else {
      shape='<circle cx="'+px+'" cy="'+py+'" r="10" fill="'+col+'" stroke="#122033" stroke-width="2"/>';
    }
    return '<g>'+shape+'<text class="point-label" x="'+(px+13)+'" y="'+(py-10)+'">'+d.month+'월</text></g>';
  }
  function legend(){
    var ly=h-22;
    if(!byC)return '<g transform="translate(70 '+ly+')"><circle cx="0" cy="0" r="7" fill="#1F3A4D"/><text class="legend-text" x="14" y="5">전체 데이터</text></g>';
    return '<g transform="translate(70 '+ly+')">'
      +'<circle cx="0" cy="0" r="7" fill="'+SCOL.w+'"/><text class="legend-text" x="14" y="5">겨울</text>'
      +'<path d="M 102 -8 L 110 7 L 94 7 Z" fill="'+SCOL.m+'" stroke="#122033" stroke-width="1.5"/><text class="legend-text" x="120" y="5">봄·가을</text>'
      +'<rect x="220" y="-7" width="14" height="14" transform="rotate(45 227 0)" fill="'+SCOL.s+'" stroke="#122033" stroke-width="1.5"/><text class="legend-text" x="244" y="5">여름</text>'
      +'</g>';
  }
  return '<svg class="season-chart" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'
    +'<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="8" fill="#fff"/>'
    +grid()
    +'<line x1="'+p.l+'" y1="'+p.t+'" x2="'+p.l+'" y2="'+(h-p.b)+'" stroke="#122033" stroke-width="2"/>'
    +'<line x1="'+p.l+'" y1="'+(h-p.b)+'" x2="'+(w-p.r)+'" y2="'+(h-p.b)+'" stroke="#122033" stroke-width="2"/>'
    +'<text class="axis-label" x="'+(p.l+plotW/2)+'" y="'+(h-47)+'" text-anchor="middle">난방비(만원)</text>'
    +'<text class="axis-label" x="20" y="'+(p.t+plotH/2)+'" text-anchor="middle" transform="rotate(-90 20 '+(p.t+plotH/2)+')">독감 환자(명)</text>'
    +DATA.map(point).join('')
    +legend()
    +'</svg>';
}

function updateSubmitUI(){

async function submitResponse(){
  if(ST.submitted)return;
  if(!ST.studentName.trim()){
    ST.submitStatus='error';ST.submitMessage='학생 번호 또는 닉네임을 입력해 주세요.';updateSubmitUI();return;
  }
  ST.submitStatus='saving';ST.submitMessage='응답을 제출하는 중이에요.';updateSubmitUI();
  try{
    var res=await fetch('/api/responses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(responsePayload())});
    var data=await res.json().catch(function(){return{};});
    if(!res.ok||!data.ok)throw new Error(data.message||'응답 저장에 실패했어요.');
    ST.submitted=true;ST.submitStatus='ok';ST.submitMessage='제출됐어요. 선생님 데이터 보드에 모였어요.';
    toast('응답이 제출됐어요.');
  }catch(err){
    ST.submitStatus='error';ST.submitMessage=err.message||'응답 저장에 실패했어요.';
  }
  updateSubmitUI();
}

  list.innerHTML=ST.responses.slice().reverse().map(function(r){
    return '<div class="resp-item">'
      +'<div class="resp-meta"><span>'+esc(r.studentName||'이름 없음')+'</span><span>'+esc(r.finalAnswer||'-')+'</span></div>'

      +'<div class="resp-text">'+esc(r.summary||'(정리 없음)')+'</div>'
      +'</div>';
  }).join('');
}
async function loadResponses(){
  ST.responseStatus='응답을 불러오는 중이에요.';renderResponses();
  try{
    var res=await fetch('/api/responses?code='+encodeURIComponent(TEACHER_CODE),{cache:'no-store'});
    var data=await res.json().catch(function(){return{};});
    if(!res.ok||!data.ok)throw new Error(data.message||'응답 보드를 불러오지 못했어요.');
    ST.responses=data.responses||[];
    ST.responseStatus='응답 '+ST.responses.length+'개를 불러왔어요.';
  }catch(err){
    ST.responses=[];
    ST.responseStatus=err.message||'응답 보드 불러오기에 실패했어요.';
  }
  renderResponses();
}
function downloadResponsesCsv(){
  if(!ST.responses.length){toast('다운로드할 응답이 아직 없어요.');return;}
  var headers=['응답ID','제출시각','학생번호/닉네임','처음선택','처음이유','최종선택','생각변화','숨은원인체크','힘체크','튼튼함체크','한문장정리','완료단계','브라우저시간','기기정보'];
  var keys=['id','submittedAt','studentName','firstAnswer','firstReason','finalAnswer','changedText','checkHiddenCause','checkStrength','checkRobust','summary','completedStep','browserTime','userAgent'];
  var rows=[headers].concat(ST.responses.map(function(r){return keys.map(function(k){return r[k]||'';});}));
  var csv=rows.map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='evalue-responses.csv';a.click();URL.revokeObjectURL(a.href);
}

  var c=document.getElementById('content');
  c.innerHTML='<div id="comp" class="active">'
    +'<div class="comp-h">🎉 수고했어요!</div>'
    +'<div class="comp-sub">탐구를 마쳤습니다.</div>'
    +'<div class="ch-msg '+(changed?'ch':'nc')+'">'
    +(changed?'생각이 바뀌는 것은 잘 배웠다는 증거예요!':'끝까지 따져보고 같은 결론을 내렸군요. 그것도 멋진 일이에요!')
    +'</div>'
    +'<div style="max-width:480px;margin:0 auto 20px;">'
    +'<div class="ari-wrap" style="flex-direction:row;justify-content:center;gap:16px;margin-bottom:16px;">'
    +ariSVG('enl',72)
    +'<div class="bubble" style="text-align:left;">고마워! 너희 덕분에 내가 무엇을 못 봤는지 알게 됐어. 다음에 나에게 물어볼 땐 꼭 이렇게 물어 줘. "너는 무엇을 보고 배웠니?"</div>'
    +'</div>'
    +'<div class="sum-cards">'
    +'<div class="sum-item"><div class="sum-lbl">처음 생각 (2단계)</div><div class="sum-val">'+(al[ST.myAnswer])+': '+esc(ST.myReason)+'</div></div>'
    +'<div class="sum-item"><div class="sum-lbl">지금 생각 (7단계)</div><div class="sum-val">'+(al[ST.finalAnswer])+'</div></div>'
    +'<div class="sum-item"><div class="sum-lbl">한 문장 정리</div><div class="sum-val">'+esc(ST.summary)+'</div></div>'
    +'</div>'
    +'<div class="submit-card">'
    +'<label for="student-name">학생 번호 또는 닉네임</label>'
    +'<div class="submit-row"><input type="text" id="student-name" class="reason-in" maxlength="40" placeholder="예: 3번 김OO" value="'+esc(ST.studentName)+'"><button id="submit-response" '+(ST.submitted||ST.submitStatus==='saving'?'disabled':'')+'>'+(ST.submitted?'제출 완료':ST.submitStatus==='saving'?'제출 중':'응답 제출')+'</button></div>'
    +'<div id="submit-status" class="submit-status '+(ST.submitStatus==='ok'?'ok':ST.submitStatus==='error'?'err':'')+'">'+esc(ST.submitMessage||'제출하면 선생님 데이터 보드에 모여요.')+'</div>'
    +'</div></div>'
    +'<button class="restart-btn" id="rstBtn">처음으로 돌아가기</button>'
    +'</div>';
  document.getElementById('footer').style.display='none';
  document.getElementById('rstBtn').onclick=function(){document.getElementById('r-modal').classList.add('open');};
  document.getElementById('student-name').addEventListener('input',function(e){ST.studentName=e.target.value;});
  document.getElementById('submit-response').onclick=submitResponse;
}

function doRestart(){
  destroyCharts();
  Object.assign(ST,{pos:0,myAnswer:null,myReason:'',seasonMap:{},scatterShown:false,selCard:null,s4done:false,ariLearnDone:false,currentH:20,card3used:false,aiPredicted:false,aiAsked:false,ariEnl:false,sliderVal:0,threshCrossed:false,pushAG:0,pushBG:0,pushedA:false,pushedB:false,expandA:false,expandB:false,finalAnswer:null,checklist:[false,false,false],summary:'',studentName:'',submitStatus:'idle',submitMessage:'',submitted:false});
  document.getElementById('footer').style.display='';
  document.getElementById('banner').classList.remove('show');
  render();
}

/* ══ TEACHER ══ */
var TEACHER_CODE='2026';
var GUIDES={0:'[도입] 데이터 탐정 콘셉트로 시작하세요.',1:'두 변수가 함께 움직임을 관찰하게 하세요. \'원인\'이라는 말은 아직 쓰지 마세요.',2:'오답을 환영하세요. 후반 단계에서 스스로 수정하는 경험이 목표입니다.',3:'계절 내부에서 관계가 사라짐 = 허위 상관의 발견.',4:'교란변수를 \'둘 다를 움직이는 숨은 원인\'으로만 부르세요.',5:'AI를 비난하는 분위기가 되지 않게 하세요. 발문: "아리는 무엇을 보고 배웠을까요? 무엇을 못 봤을까요?"',6:'발문: "기온이 범인인 건 알았어요. 기온의 영향력이 아주 약했다면 어땠을까요?" 아리의 말풍선 변화를 함께 관찰하세요.',7:'체크리스트 세 질문이 이 수업의 최종 산출물입니다. 사람과 AI에게 같은 질문이 필요하다는 점으로 마무리하세요.'};
function isSeasonActivity(){
  var item=TL[ST.pos];
  return !!(item&&item.k==='ac'&&item.s===3);
}
function syncTeacherControls(){
  var autoHead=document.getElementById('season-auto-head-btn');
  if(autoHead)autoHead.hidden=!(ST.teacherUnlocked&&isSeasonActivity());
  var teacherBtn=document.getElementById('teacher-btn');
  if(teacherBtn)teacherBtn.textContent=ST.teacherUnlocked&&ST.teacherMode?'교사용 닫기':'교사용';
}
function renderTeacher(){
  var panel=document.getElementById('tpanel');
  var open=ST.teacherUnlocked&&ST.teacherMode;
  panel.classList.toggle('open',open);
  syncTeacherControls();
  if(!open)return;
  var curStep=TL[ST.pos]?TL[ST.pos].s:7;
  var td=document.getElementById('t-data');
  if(td&&!td.querySelector('table')){
    var tbl=document.createElement('table');tbl.className='t-tbl';
    tbl.innerHTML='<thead><tr><th>월</th><th>기온</th><th>난방비</th><th>독감</th></tr></thead><tbody>'
      +DATA.map(function(d){return'<tr><td>'+d.month+'월</td><td>'+d.temp+'℃</td><td>'+d.heating+'만원</td><td>'+d.flu+'명</td></tr>';}).join('')+'</tbody>';
    td.appendChild(tbl);
  }
  var tg=document.getElementById('t-guide');
  if(tg)tg.innerHTML=Object.keys(GUIDES).map(function(s){return'<div class="g-item'+(+s===curStep?' cur':'')+'"><strong>'+s+'단계:</strong> '+GUIDES[s]+'</div>';}).join('');
  renderResponses();
  var ts3=document.getElementById('t-s3');if(ts3)ts3.style.display=isSeasonActivity()?'':'none';
  var ts6=document.getElementById('t-s6');if(ts6){ts6.style.display=curStep===6?'':'none';var ti=document.getElementById('t-sl');if(ti)ti.textContent='현재: '+ST.sliderVal.toFixed(2)+' / 임계값: '+THRESHOLD;}
}
function openTeacherModal(){
  var modal=document.getElementById('t-modal');
  var input=document.getElementById('teacher-code');
  var error=document.getElementById('teacher-code-error');
  if(error)error.textContent='';
  if(input)input.value='';
  modal.classList.add('open');
  setTimeout(function(){if(input)input.focus();},0);
}
function closeTeacherModal(){
  var modal=document.getElementById('t-modal');
  var input=document.getElementById('teacher-code');
  var error=document.getElementById('teacher-code-error');
  modal.classList.remove('open');
  if(input)input.value='';
  if(error)error.textContent='';
}
function unlockTeacher(){
  var input=document.getElementById('teacher-code');
  var error=document.getElementById('teacher-code-error');
  var code=input?input.value.trim():'';
  if(code!==TEACHER_CODE){
    if(error)error.textContent='입장 코드가 맞지 않아요.';
    if(input)input.select();
    toast('교사용 입장 코드가 필요해요.');
    return;
  }
  ST.teacherUnlocked=true;
  ST.teacherMode=true;
  closeTeacherModal();
  renderTeacher();
  if(ST.presentMode)renderPBar();
  toast('교사용 도구가 열렸어요.');
}
function autoSortSeasons(){
  if(!ST.teacherUnlocked){
    openTeacherModal();
    return;
  }
  if(!isSeasonActivity()){
    toast('3단계 계절 분류 화면에서 사용할 수 있어요.');
    return;
  }
  DATA.forEach(function(d){ST.seasonMap[d.month]=SMAP[d.month];});
  ST.scatterShown=true;
  ST.selCard=null;
  refreshCards();
  showS3Scatter();
  updNext();
  renderTeacher();
  toast('계절별로 한 번에 나눴어요.');
}

/* ══ PRESENT MODE ══ */
function renderPBar(){
  var total=TL.length+1;
  var cur=ST.pos>=TL.length?total:ST.pos+1;
  var pbar=document.getElementById('pbar-counter');
  if(pbar)pbar.textContent='슬라이드 '+cur+' / '+total;
  var pnote=document.getElementById('pbar-note');
  if(pnote&&ST.teacherUnlocked&&ST.teacherMode){var curStep=TL[ST.pos]?TL[ST.pos].s:7;pnote.textContent='💡 '+GUIDES[curStep];}
  else if(pnote)pnote.textContent='';
}

/* ══ NAVIGATION ══ */
function go(dir){
  if(dir>0){
    if(!canProceed()){
      var hints={2:'O 또는 X를 선택하고 이유를 입력해 주세요.',3:'월 카드를 모두 올바르게 분류하고 확인하기를 눌러 주세요.',4:'다이어그램 애니메이션이 끝날 때까지 기다려 주세요.',5:'예측을 1회 이상 하고 왜 버튼을 눌러 주세요.',6:'슬라이더를 임계값 이상 올려 주세요.',7:'체크리스트를 모두 체크하고 한 문장을 입력해 주세요.'};
      var s=TL[ST.pos]?TL[ST.pos].s:7;
      toast(hints[s]||'조건을 완료해 주세요.');return;
    }
    if(ST.pos<TL.length){ST.pos++;render();}
    else showCompletion();
  } else {
    if(ST.pos>0){ST.pos--;render();}
  }
}

/* ══ EVENTS ══ */
document.getElementById('prev-btn').onclick=function(){go(-1);};
document.getElementById('next-btn').onclick=function(){go(1);};

document.getElementById('present-btn').onclick=function(){
  if(!ST.presentMode){
    ST.presentMode=true;
    document.body.classList.add('present');
    document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(function(){});
    this.textContent='발표 종료';
  } else {
    ST.presentMode=false;
    document.body.classList.remove('present');
    document.fullscreenElement&&document.exitFullscreen&&document.exitFullscreen().catch(function(){});
    this.textContent='발표';
  }
  render();
};
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&ST.presentMode){
    ST.presentMode=false;document.body.classList.remove('present');
    document.getElementById('present-btn').textContent='발표';render();
  }
});
document.addEventListener('keydown',function(e){
  if(!ST.presentMode)return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(e.key==='Escape'){document.getElementById('present-btn').click();}
});

document.getElementById('teacher-btn').onclick=function(){
  if(!ST.teacherUnlocked){
    openTeacherModal();
    return;
  }
  ST.teacherMode=!ST.teacherMode;
  renderTeacher();
  if(ST.presentMode)renderPBar();
};
document.getElementById('t-conf').onclick=unlockTeacher;
document.getElementById('t-canc').onclick=closeTeacherModal;
document.getElementById('teacher-code').addEventListener('keydown',function(e){if(e.key==='Enter')unlockTeacher();});
document.getElementById('teacher-code').addEventListener('input',function(){document.getElementById('teacher-code-error').textContent='';});
document.getElementById('tclose').onclick=function(){ST.teacherMode=false;renderTeacher();if(ST.presentMode)renderPBar();};
document.getElementById('auto-btn').onclick=autoSortSeasons;
document.getElementById('season-auto-head-btn').onclick=autoSortSeasons;
document.getElementById('resp-refresh').onclick=loadResponses;
document.getElementById('resp-csv').onclick=downloadResponsesCsv;
document.getElementById('r-conf').onclick=function(){document.getElementById('r-modal').classList.remove('open');doRestart();};
document.getElementById('r-canc').onclick=function(){document.getElementById('r-modal').classList.remove('open');};
document.getElementById('pz-left').onclick=function(){go(-1);};
document.getElementById('pz-right').onclick=function(){go(1);};

/* ══ UTIL ══ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ══ INIT ══ */
render();
})();
</script>
